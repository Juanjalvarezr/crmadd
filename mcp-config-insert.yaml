# MCPs recomendados — insertar en ~/.hermes/config.yaml despues de mcp_servers:
mcp_servers:
  n8n:
    command: npx
    args:
      - n8n-mcp
    enabled: true
  cua-driver:
    command: C:\Users\jujoa\AppData\Local\Programs\Cua\cua-driver\bin\cua-driver.exe
    args:
      - mcp
    enabled: true
  supabase:
    command: npx
    args:
      - "-y"
      - "@supabase/mcp-server-supabase@latest"
    env:
      SUPABASE_API_KEY: "${SUPABASE_API_KEY}"
      SUPABASE_PROJECT_REF: "${SUPABASE_PROJECT_REF}"
    enabled: true
  vercel:
    command: npx
    args:
      - "-y"
      - vercel-mcp-server@latest
    env:
      VERCEL_API_TOKEN: "${VERCEL_API_TOKEN}"
      VERCEL_TEAM_ID: "${VERCEL_TEAM_ID}"
    enabled: true
  resend:
    command: npx
    args:
      - "-y"
      - resend-mcp-server@latest
    env:
      RESEND_API_KEY: "${RESEND_API_KEY}"
    enabled: true
  openwa:
    command: npx
    args:
      - "-y"
      - openwa-mcp-server@latest
    env:
      OPENWA_API_KEY: "${OPENWA_API_KEY}"
      OPENWA_API_URL: "http://127.0.0.1:2785"
    enabled: true
  google-calendar:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-google-calendar@latest"
    env:
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS}"
    enabled: true
  github:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-github@latest"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
    enabled: true
